server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Cache hashed static assets for a long time
  location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Never cache index.html so new deploys are picked up
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback: send all other routes to Angular's router
  location / {
    try_files $uri $uri/ /index.html;
  }
}